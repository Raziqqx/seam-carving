# Continuous delivery (the "CD" half of bonus 7c).
# Pushing a version tag such as v1.0.0 builds the project, runs the full test suite and,
# only if everything passes, publishes a GitHub Release with the deliverables attached:
#   - the seamcarve command-line tool (Linux x86-64)
#   - the report PDF
#   - the presentation slides
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # needed to create the release

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libopencv-dev catch2 libboost-graph-dev
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSEAM_WERROR=ON
      - name: Build
        run: cmake --build build -j 4
      - name: Test
        run: ctest --test-dir build --output-on-failure -j 4
      - name: Collect the files to publish
        run: |
          mkdir dist
          cp build/seamcarve dist/seamcarve-linux-x86_64
          cp report/report.pdf dist/Team5_Seam_Carving_Report.pdf
          cp slides/Team5_Seam_Carving.pptx dist/
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${GITHUB_REF_NAME}" dist/*
          --title "Seam carving ${GITHUB_REF_NAME}"
          --notes "Built and tested automatically from tag ${GITHUB_REF_NAME}.
          The seamcarve binary is dynamically linked: it needs the OpenCV 4 runtime
          libraries (on Ubuntu 24.04: sudo apt-get install libopencv-dev)."
